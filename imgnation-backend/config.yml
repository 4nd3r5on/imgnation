api:
  host: "0.0.0.0"
  port: 80
  prefix: ""
  cors:
    allowed_origins:
      - "*"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Accept"
      - "Accept-Language"
      - "Authorization"
      - "Cache-Control"
      - "Content-Language"
      - "Content-Type"
      - "DNT"
      - "If-Modified-Since"
      - "Keep-Alive"
      - "Origin"
      - "User-Agent"
      - "X-Requested-With"
      - "X-HTTP-Method-Override"
      - "X-CSRF-Token"
      - "X-API-Key"
      - "X-Client-Version"
      - "X-Forwarded-For"
      - "X-Real-IP"
    allow_credentials: true

permissions:
  default_role: unauthorized
  roles:
    unauthorized:
      max_upload_size: "500KB"
      uploads_allowed: # just content types
        - image/png
        - image/jpeg
        - image/webp
        - image/gif
      encryption_allowed: true
    user:
      max_upload_size: "5MB"
      uploads_allowed: # all the allowed upload types for now
        - image/png
        - image/jpeg
        - image/webp
        - image/gif
        - video/mp4
        - video/quicktime
        - video/x-msvideo
      encryption_allowed: true
    admin:
      max_upload_size: "0" # no limit
      # any uploads allowed
      encryption_allowed: true
    banned:
      max_upload_size: "-1" # uploads forbidden
      encryption_allowed: false

